<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="fist" x1="20" y1="26" x2="112" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d3e6ff"/>
      <stop offset=".36" stop-color="#7eb8ff"/>
      <stop offset=".7" stop-color="#5f8bee"/>
      <stop offset="1" stop-color="#8a7ae8"/>
    </linearGradient>
    <linearGradient id="wrist" x1="40" y1="94" x2="96" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5f92dd"/>
      <stop offset=".6" stop-color="#4f74d6"/>
      <stop offset="1" stop-color="#6a5cc9"/>
    </linearGradient>
    <linearGradient id="thumb" x1="16" y1="62" x2="86" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b8d6ff"/>
      <stop offset=".55" stop-color="#6ea4f5"/>
      <stop offset="1" stop-color="#6f74d8"/>
    </linearGradient>
  </defs>
  <!-- the forearm, behind the fist -->
  <path d="M48 92h32c8 0 14 6 14 14v10c0 8-6 14-14 14H48c-8 0-14-6-14-14v-10c0-8 6-14 14-14Z" fill="url(#wrist)"/>
  <!-- the fist: knuckles forward -->
  <g fill="url(#fist)">
    <rect x="20" y="30" width="96" height="70" rx="28"/>
    <circle cx="40" cy="33" r="11.5"/>
    <circle cx="66" cy="30" r="12"/>
    <circle cx="92" cy="33" r="11.5"/>
  </g>
  <!-- the fingers, curled -->
  <g stroke="#132043" stroke-opacity=".26" stroke-width="5" stroke-linecap="round">
    <path d="M56 48v22"/>
    <path d="M80 46v24"/>
    <path d="M101 50v20"/>
  </g>
  <!-- the thumb, across the front -->
  <g transform="rotate(-8 50 83)">
    <rect x="14" y="64" width="72" height="38" rx="19" fill="url(#thumb)"/>
    <rect x="14" y="64" width="72" height="38" rx="19" fill="none" stroke="#eaf2ff" stroke-opacity=".45" stroke-width="2.5"/>
  </g>
  <!-- the light on the knuckles -->
  <ellipse cx="41" cy="27" rx="7" ry="4" fill="#fff" opacity=".45" transform="rotate(-22 41 27)"/>
</svg>
